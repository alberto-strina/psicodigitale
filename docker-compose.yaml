version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: psicologi_db
      POSTGRES_USER: psicologi_user
      POSTGRES_PASSWORD: psicologi_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=psicologi_db
      - DB_USER=psicologi_user
      - DB_PASSWORD=psicologi_pass
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-ho5dg*sfcw#@!y0i(8&!vyegc+*2*pi=f)8&^b%6pgct-u^y*p

volumes:
  postgres_data:
